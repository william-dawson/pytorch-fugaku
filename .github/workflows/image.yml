name: image

# Builds the arm64 image (official PyTorch wheel + torch_fugaku) natively on
# GitHub's arm64 runner, tests it, and pushes it to ghcr.io/<owner>/pytorch-fugaku.
# Tags: the commit SHA, plus "latest" on main and the tag name on v* tags.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "source-build/**", ".github/workflows/source-build.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pytorch-fugaku
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: pytorch-fugaku:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Tests before pushing. The runner's CPU has SVE (128-bit), so the SVE
      # kernels are exercised. Open MPI 4.0.1's mpirun needs an rsh agent on
      # the path even for local ranks, and ignores OMPI_ALLOW_RUN_AS_ROOT; both
      # are set here only, not in the image, since Fujitsu MPI also reads
      # OMPI_MCA_* variables.
      - name: Import and autoload
        run: docker run --rm pytorch-fugaku:test python -c "import torch, torch_fugaku; s = torch_fugaku.status(); print(torch.__version__, s); assert 'parbmm' in s['kernels'] and s['backend'] == 'fjmpi' and not torch.backends.mkldnn.enabled"
      - name: Kernels
        run: docker run --rm -e TORCH_FUGAKU=0 pytorch-fugaku:test python /opt/pytorch-fugaku/tests/test_kernels.py
      - name: DDP gradients over MPI, 2 ranks
        run: |
          docker run --rm -e TORCH_FUGAKU=0 -e OMPI_MCA_plm_rsh_agent=false pytorch-fugaku:test \
            mpirun --allow-run-as-root --oversubscribe -np 2 python /opt/pytorch-fugaku/tests/test_ddp_mpi.py
      - name: torch.distributed backend over MPI, 2 and 4 ranks
        run: |
          for n in 2 4; do
            docker run --rm -e OMP_NUM_THREADS=1 -e OMPI_MCA_plm_rsh_agent=false pytorch-fugaku:test \
              mpirun --allow-run-as-root --oversubscribe -np $n python /opt/pytorch-fugaku/tests/test_backend_mpi.py
          done
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          cache-from: type=gha
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
